<mat-card class="create-offer-card">
  <mat-card-title class="card-title">
    <span class="title-text">Create an Offer</span>
  </mat-card-title>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-field form-paired-field">
          <mat-form-field appearance="outline">
            <input matInput type="date" formControlName="startDate">
            <mat-error *ngIf="f['startDate'].errors?.['required'] && submitted">Field is required</mat-error>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <input matInput type="date" formControlName="endDate">
            <mat-error *ngIf="f['endDate'].errors?.['required'] && submitted">Field is required</mat-error>
            <mat-error *ngIf="f['endDate'].errors?.['mustBeGreater'] && submitted">Field must be greater than startDate</mat-error>
          </mat-form-field>
        </div>
      </div>
      <div class="form-row">
        <div class="form-field form-single-field">
          <mat-form-field appearance="outline">
            <input matInput type="text" formControlName="title">
            <mat-error *ngIf="f['title'].errors?.['required'] && submitted">Title is a required field.</mat-error>
            <mat-error *ngIf="f['title'].errors?.['minlength'] && submitted">Title must have a min length of 6 characters</mat-error>
          </mat-form-field>
        </div>
      </div>
      <div class="form-row">
        <div class="form-field form-single-field">
          <mat-form-field appearance="outline">
            <textarea matInput formControlName="description"></textarea>
          </mat-form-field>
        </div>
      </div>
      <button mat-raised-button color="primary" type="submit" [disabled]="!form.valid" class="create-offer-button">Submit</button>
    </form>
  </mat-card-content>
</mat-card>
