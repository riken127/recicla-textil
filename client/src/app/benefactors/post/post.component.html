<div class="container">
  <h1 mat-dialog-title>{{ post?.title }}</h1>
  <div mat-dialog-content>
    <img src="https://picsum.photos/500/500" alt="Error Loading Image" />
    <p>{{ post?.content }}</p>
    <div class="link-buttons" style="display: flex; flex-wrap: wrap;">
      <div class="dialog-actions">
      <div *ngFor="let link of post?.links">
        <button
          mat-raised-button
          color="primary"
          (click)="onLinkClick(link.link)"
          title="{{ link.onHover }}"
        >
          {{ link.title }}
        </button>
      </div>
    </div>
      <button mat-raised-button (click)="onClose()">Close</button>
    </div>
  </div>
</div>
