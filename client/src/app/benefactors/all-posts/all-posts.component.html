<div>
  <div class="header-container">
    <div class="title-container">
      <h1 class="title">Offers</h1>
    </div>
  </div>

  <div *ngIf="posts.length > 0">
    <mat-grid-list cols="3" rowHeight="350px">
      <mat-grid-tile *ngFor="let post of posts">
        <mat-card>
          <mat-card-header
            [ngStyle]="{
              'background-image': post.image
                ? 'url(' + post.image + ')'
                : 'url(https://api.dicebear.com/8.x/shapes/svg?seed=' + post._id + ')'
            }"
            class="banner-header"
          ></mat-card-header>
          <mat-card-content>
            <mat-card-title id="title">{{ post.title }}</mat-card-title>
            <mat-card-subtitle id="description">
              {{ post.content }}
            </mat-card-subtitle>
          </mat-card-content>
          <mat-card-actions>
            <button mat-button (click)="onClick(post.benefactorId)">Donate</button>
          </mat-card-actions>
        </mat-card>
      </mat-grid-tile>
    </mat-grid-list>
  </div>
  <div *ngIf="posts.length === 0 && !loading" class="empty-container">
    <h2>No posts found</h2>
  </div>
  <div *ngIf="loading" class="loading-container">
    <mat-spinner></mat-spinner>
  </div>
</div>
