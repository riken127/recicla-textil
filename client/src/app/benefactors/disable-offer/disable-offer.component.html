<mat-card class="disable-offer-card">
  <mat-card-title class="card-title">
    <span class="title-text">Are you sure you want to disable this offer?</span>
  </mat-card-title>
  <mat-card-content>
  <div class="form-paired-field">
    <button mat-raised-button color="primary" (click)="onDelete()">Yes</button>
    <button mat-riased-button color="secondary" (click)="onCancel()">No</button>
  </div>
  </mat-card-content>
</mat-card>
