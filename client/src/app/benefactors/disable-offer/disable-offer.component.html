<mat-card class="disable-offer-card">
  <mat-card-title class="card-title">
    <span class="title-text">Are you sure you want to disable this offer?</span>
  </mat-card-title>
  <mat-card-content>
    <div class="form-paired-field">
      <button (click)="onDelete()" color="primary" mat-raised-button>Yes</button>
      <button (click)="onCancel()" color="secondary" mat-riased-button>No</button>
    </div>
  </mat-card-content>
</mat-card>
