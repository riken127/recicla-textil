<div>
  <div class="header-container">
    <div class="title-container">
      <h1 class="title">Benefactors</h1>
    </div>
    <div class="search-container">
      <mat-form-field class="search-field" appearance="outline">
        <mat-label>Search...</mat-label>
        <input matInput placeholder="Search..." />
        <button mat-icon-button matSuffix>
          <mat-icon>search</mat-icon>
        </button>
      </mat-form-field>
    </div>
  </div>

  @if(benefactors.length > 0){

  <mat-grid-list cols="3" rowHeight="350px">
    <mat-grid-tile *ngFor="let benefactor of benefactors">
      <mat-card>
        <mat-card-header
          [ngStyle]="{
            'background-image': benefactor.banner
              ? 'url(' + benefactor.banner + ')'
              : 'url(https://api.dicebear.com/8.x/shapes/svg?seed=' +
                benefactor.phone +
                ')'
          }"
          class="banner-header"
        >
        </mat-card-header>
        <mat-card-content>
          <div
            aria-colindex="1"
            mat-card-avatar
            [ngStyle]="{
              'background-image': benefactor.logo
                ? 'url(' + benefactor.logo + ')'
                : 'url(https://api.dicebear.com/8.x/shapes/svg?seed=' +
                  benefactor.email +
                  ')'
            }"
            class="avatar"
          ></div>
          <mat-card-title id="name">{{ benefactor.name }}</mat-card-title>
          <mat-card-subtitle id="description">{{
            benefactor.description
          }}</mat-card-subtitle>
        </mat-card-content>
        <mat-card-actions>
          <button mat-button (click)="onClick(benefactor._id)">VIEW</button>
        </mat-card-actions>
      </mat-card>
    </mat-grid-tile>
  </mat-grid-list>

  } @else {

  <div class="empty-container">
    <h2>No benefactors found</h2>
  </div>
  
  }

</div>
