<mat-card class="create-prize-card">
  <mat-card-title class="card-title">
    <span class="title-text">Create a Prize</span>
  </mat-card-title>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-field form-single-field">
          <mat-form-field appearance="outline">
            <input matInput type="number" formControlName="price">
            <mat-error *ngIf="f['price'].errors?.['required'] && submitted">Field is required</mat-error>
          </mat-form-field>
        </div>
        <div class="form-field form-single-field">
          <mat-form-field appearance="outline">
            <input matInput type="text" formControlName="title">
            <mat-error *ngIf="f['title'].errors?.['required'] && submitted">Field is required</mat-error>
          </mat-form-field>
        </div>
        <div class="form-field form-single-field">
          <mat-form-field appearance="outline">
            <textarea matInput formControlName="description"></textarea>
          </mat-form-field>
        </div>
      </div>
      <button mat-raised-button color="primary" type="submit" [disabled]="!form.valid" class="create-prize-button">Submit</button>
    </form>
  </mat-card-content>
</mat-card>
