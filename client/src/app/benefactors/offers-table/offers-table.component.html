<mat-card class="mat-card">
  <button mat-raised-button (click)="navigateToCreateOffers()">
    Add Offer
  </button>
  <mat-card-content class="element-detail">
    <div class="mat-elevation-z8">
      <table
        mat-table
        [dataSource]="offers"
        class="mat-elevation-z8 inner-table"
        multiTemplateDataRows
      >
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef class="center-cell">Title</th>
          <td mat-cell *matCellDef="let offer" class="center-cell">
            {{ offer.title }}
          </td>
        </ng-container>C
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef class="center-cell">
            Description
          </th>
          <td mat-cell *matCellDef="let offer" class="center-cell">
            {{ offer.description }}
          </td>
        </ng-container>
        <ng-container matColumnDef="startDate">
          <th mat-header-cell *matHeaderCellDef class="center-cell">
            Start Date
          </th>
          <td mat-cell *matCellDef="let offer" class="center-cell">
            {{ formatDate(offer.startDate) }}
          </td>
        </ng-container>
        <ng-container matColumnDef="endDate">
          <th mat-header-cell *matHeaderCellDef class="center-cell">
            End Date
          </th>
          <td mat-cell *matCellDef="let offer" class="center-cell">
            {{ formatDate(offer.endDate) }}
          </td>
        </ng-container>
        <ng-container matColumnDef="points">
          <th mat-header-cell *matHeaderCellDef class="center-cell">Points</th>
          <td mat-cell *matCellDef="let offer" class="center-cell">
            {{ offer.points }}
          </td>
        </ng-container>
        <ng-container matColumnDef="active">
          <th mat-header-cell *matHeaderCellDef class="center-cell">Active</th>
          <td
            mat-cell
            *matCellDef="let offer"
            class="center-cell"
            [attr.data-status]="offer.active ? 'active' : 'canceled'"
          ></td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="center-cell">Actions</th>
          <td mat-cell *matCellDef="let offer" class="center-cell">
            <button mat-icon-button (click)="editOffer(offer)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button (click)="toggleOffer(offer)">
              <mat-icon>compare_arrows</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
