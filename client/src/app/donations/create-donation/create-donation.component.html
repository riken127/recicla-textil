<form (ngSubmit)="onSubmit()" [formGroup]="donationForm">
  <div class="form-group">
    <label for="userId">User ID</label>
    <input [value]="userId" id="userId" readonly type="text">
  </div>
  <div class="form-group">
    <label for="benefactorId">Benefactor ID</label>
    <input [value]="benefactor?._id" id="benefactorId" readonly type="text">
  </div>
  <div class="form-group">
    <label for="pickpoint">Pickpoint</label>
    <select formControlName="pickpoint" id="pickpoint">
      <option *ngFor="let pickpoint of pickpoints" [value]="pickpoint._id">
        {{ pickpoint.street }}, {{ pickpoint.city }}, {{ pickpoint.postalCode }}, {{ pickpoint.country }}
      </option>
    </select>
  </div>
  <button type="submit">Submit</button>
</form>
