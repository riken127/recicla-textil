<form (ngSubmit)="onSubmit()" [formGroup]="donationForm" class="form-container">
  <div class="form-group" hidden>
    <label for="userId">User ID</label>
    <input [value]="userId" id="userId" readonly type="text">
  </div>
  <div class="form-group" hidden>
    <label for="benefactorId">Benefactor ID</label>
    <input [value]="benefactor?._id" id="benefactorId" readonly type="text">
  </div>
  <div class="form-group">
    <mat-form-field appearance="fill">
      <mat-label>Pickpoint</mat-label>
      <mat-select formControlName="pickpoint" id="pickpoint">
        <mat-option *ngFor="let pickpoint of pickpoints" [value]="pickpoint._id">
          {{ pickpoint.street }}, {{ pickpoint.city }}, {{ pickpoint.postalCode }}, {{ pickpoint.country }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div class="button-container">
    <button  mat-raised-button type="submit">Submit</button>
  </div>
</form>
