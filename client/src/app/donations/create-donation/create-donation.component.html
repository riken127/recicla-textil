<mat-card class="edit-item-card">
  <mat-card-title class="card-title">
    <span class="title-text">Create Donation</span>
  </mat-card-title>
  <mat-card-content>
    <form [formGroup]="donationForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <mat-form-field appearance="outline" class="form-single-field">
          <mat-label>Pickpoint</mat-label>
          <mat-select formControlName="pickpoint" id="pickpoint" required>
            <mat-option *ngFor="let pickpoint of pickpoints" [value]="pickpoint._id">
              {{ pickpoint.street }}, {{ pickpoint.city }}, {{ pickpoint.postalCode }}, {{ pickpoint.country }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="donationForm.get('pickpoint')?.hasError('required')">Pickpoint is required</mat-error>
        </mat-form-field>
      </div>
      <div class="form-row">
        <button [disabled]="!donationForm.valid" class="edit-item-button" color="primary" mat-raised-button type="submit">Submit</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
