<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="brand">
      <th mat-header-cell *matHeaderCellDef class="center-cell">Brand</th>
      <td mat-cell *matCellDef="let item" class="center-cell">
        {{ item.brand }}
      </td>
    </ng-container>
    <ng-container matColumnDef="weight">
      <th mat-header-cell *matHeaderCellDef class="center-cell">Weight</th>
      <td mat-cell *matCellDef="let item" class="center-cell">
        {{ item.weight.value }} {{ item.weight.unit }}
      </td>
    </ng-container>
    <ng-container matColumnDef="size">
      <th mat-header-cell *matHeaderCellDef class="center-cell">Size</th>
      <td mat-cell *matCellDef="let item" class="center-cell">
        {{ item.size }}
      </td>
    </ng-container>
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef class="center-cell">Type</th>
      <td mat-cell *matCellDef="let item" class="center-cell">
        {{ item.type }}
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <button mat-raised-button color="primary" (click)="navigateToCreateItem()">
    Add Item
  </button>
  <button mat-raised-button color="primary" (click)="finalize()">
    Finalize
  </button>
</div>
