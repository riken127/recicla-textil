<form (ngSubmit)="onSubmit()" [formGroup]="itemForm" class="form-container">
  <div class="form-row">
    <div class="form-field form-single-field">
  <mat-form-field appearance="fill">
    <mat-label>Brand</mat-label>
    <input formControlName="brand" matInput>
  </mat-form-field>
    </div>
  </div>
  <div class="form-row">
    <div class="form-field form-paired-field">
  <mat-form-field appearance="fill">
    <mat-label>Weight Value</mat-label>
    <input formControlName="weightValue" matInput>
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Weight Unit</mat-label>
    <input formControlName="weightUnit" matInput>
  </mat-form-field>
    </div>
  </div>
  <div class="form-row">
    <div class="form-field form-paired-field">
  <mat-form-field appearance="fill">
    <mat-label>Size</mat-label>
    <input formControlName="size" matInput>
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Type</mat-label>
    <input formControlName="type" matInput>
  </mat-form-field>
    </div>
  </div>
  <button type="submit" mat-raised-button class="create-item-button" mat-button color="primary">Create Item</button>
</form>
